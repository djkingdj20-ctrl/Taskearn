<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskEarn - Complete Tasks & Earn Money</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- GOOGLE SIGN-IN SDK (onload తో అప్‌డేట్ చేయబడింది) -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="renderGoogleButtons()"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --secondary: #06b6d4;
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%); background-attachment: fixed; }
    
    .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #818cf8, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 0.5rem; }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-btn { background: transparent; color: var(--text-muted); border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 600; font-size: 0.9rem; }
    .nav-btn:hover, .nav-btn.active { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .main-container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; box-shadow: var(--glass-shadow); margin-bottom: 2rem; }
    .hidden { display: none !important; }

    /* Auth Styling */
    .auth-container { max-width: 450px; margin: 3rem auto; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
    .auth-tab { flex: 1; text-align: center; padding: 0.6rem; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 600; }
    .auth-tab.active { background: var(--primary); color: white; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem; }
    .form-control { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text-main); font-size: 0.95rem; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); margin: 1.5rem 0; font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }

    /* Dashboard & Wallet */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .stat-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(79, 70, 229, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 0.2rem; }
    
    .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .task-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .task-card:hover { transform: translateY(-4px); background: var(--bg-card-hover); }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(79, 70, 229, 0.2); color: #a5b4fc; margin-bottom: 0.8rem; }
    
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    
    .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
    .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #6ee7b7; }

    .google-btn-container { min-height: 44px; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fa-solid fa-wallet"></i> TaskEarn
      </div>
      <div class="nav-links" id="navLinks">
        <!-- Dynamic Nav Links -->
      </div>
    </div>
  </nav>

  <div class="main-container">
    <!-- AUTH SECTION -->
    <div id="authSection" class="auth-container card hidden">
      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTab" onclick="switchAuthMode('login')">Login</div>
        <div class="auth-tab" id="registerTab" onclick="switchAuthMode('register')">Register</div>
      </div>

      <div id="authAlert" class="alert hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" id="regName" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" class="form-control" id="regMobile" required>
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" class="form-control" id="regCity" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="regPassword" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <div class="divider">OR</div>

      <div id="googleLoginButton" class="google-btn-container"></div>
      <div id="googleRegisterButton" class="google-btn-container hidden"></div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="appSection" class="hidden">
      
      <!-- Stats Banner -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
          <div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Available Balance</div>
            <div class="stat-val" id="userBalance">₹0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-list-check"></i></div>
          <div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Tasks Completed</div>
            <div class="stat-val" id="userCompletedTasks">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Pending Tasks</div>
            <div class="stat-val" id="userPendingTasks">0</div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs inside App -->
      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        <button class="nav-btn active" onclick="switchView('tasks')" id="viewBtnTasks"><i class="fa-solid fa-tasks"></i> Available Tasks</button>
        <button class="nav-btn" onclick="switchView('history')" id="viewBtnHistory"><i class="fa-solid fa-history"></i> My Submissions</button>
        <button class="nav-btn" onclick="switchView('wallet')" id="viewBtnWallet"><i class="fa-solid fa-wallet"></i> Wallet & Withdraw</button>
        <button class="nav-btn hidden" id="adminTabBtn" onclick="switchView('admin')"><i class="fa-solid fa-user-shield"></i> Admin Panel</button>
      </div>

      <!-- Views Container -->
      <div id="viewTasks">
        <div class="tasks-grid" id="tasksList"></div>
      </div>

      <div id="viewHistory" class="card hidden">
        <h2 style="margin-bottom: 1rem;">Submission History</h2>
        <div id="submissionsList"></div>
      </div>

      <div id="viewWallet" class="card hidden">
        <h2 style="margin-bottom: 1rem;">Withdraw Earnings</h2>
        <form onsubmit="handleWithdraw(event)" style="max-width: 400px;">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" class="form-control" id="withdrawAmount" min="50" required>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select class="form-control" id="withdrawMethod" required>
              <option value="UPI">UPI</option>
              <option value="Paytm">Paytm</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div class="form-group">
            <label>UPI ID / Account Details</label>
            <input type="text" class="form-control" id="withdrawDetails" placeholder="e.g. 9876543210@paytm" required>
          </div>
          <button type="submit" class="btn-primary">Submit Withdrawal Request</button>
        </form>

        <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Withdrawal History</h3>
        <div id="withdrawalsList"></div>
      </div>

      <div id="viewAdmin" class="card hidden">
        <h2>Admin Management Panel</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Manage tasks, approve user submissions and withdrawals.</p>
        
        <!-- Admin Submissions Management -->
        <h3>Pending Submissions</h3>
        <div id="adminSubmissionsList" style="margin-bottom: 2rem;"></div>

        <!-- Admin Withdrawals Management -->
        <h3>Pending Withdrawals</h3>
        <div id="adminWithdrawalsList"></div>
      </div>

    </div>
  </div>

  <!-- TASK PROOF MODAL -->
  <div id="taskModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTaskTitle" style="margin-bottom: 0.5rem;">Submit Task Proof</h2>
      <p id="modalTaskDesc" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;"></p>
      
      <form onsubmit="submitTaskProof(event)">
        <input type="hidden" id="modalTaskId">
        <div class="form-group">
          <label>Proof Text / Details</label>
          <textarea class="form-control" id="proofText" rows="3" placeholder="Enter transaction ID, username, or proof details..."></textarea>
        </div>
        <div class="form-group">
          <label>Upload Proof Screenshot (Optional)</label>
          <input type="file" class="form-control" id="proofImage" accept="image/*">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Submit Verification</button>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentAuthMode = 'login';
    let currentTaskId = null;

    async function api(endpoint, options = {}) {
      options.headers = { "Content-Type": "application/json", ...options.headers };
      options.credentials = "include";
      const res = await fetch(endpoint, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      return data;
    }

    /* GOOGLE AUTHENTICATION (సరిచేసిన ఫంక్షన్) */
    async function renderGoogleButtons() {
      if (!window.google || !window.google.accounts) return;
      try {
        const { clientId } = await api("/api/google-config");
        if (!clientId) return;

        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: async (res) => {
            if (res.credential) {
              try {
                showAuthAlert("Signing in with Google...", "success");
                const data = await api("/api/auth/google", {
                  method: "POST",
                  body: JSON.stringify({ credential: res.credential })
                });
                currentUser = data.user;
                initApp();
              } catch (err) {
                showAuthAlert(err.message, "danger");
              }
            }
          }
        });

        setTimeout(() => {
          const lBtn = document.getElementById("googleLoginButton");
          const rBtn = document.getElementById("googleRegisterButton");
          if (lBtn) {
            lBtn.innerHTML = "";
            window.google.accounts.id.renderButton(lBtn, { theme: "filled_blue", size: "large", width: "100%" });
          }
          if (rBtn) {
            rBtn.innerHTML = "";
            window.google.accounts.id.renderButton(rBtn, { theme: "filled_blue", size: "large", width: "100%" });
          }
        }, 50);

      } catch (err) {
        console.error("Google Auth Setup Failed:", err);
      }
    }

    async function checkSession() {
      try {
        currentUser = await api("/api/me");
        if (currentUser) {
          initApp();
        } else {
          showAuthView();
        }
      } catch (err) {
        showAuthView();
      }
    }

    function showAuthView() {
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("appSection").classList.add("hidden");
      renderGoogleButtons();
      renderNav();
    }

    function initApp() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("appSection").classList.remove("hidden");
      renderNav();
      loadUserData();
      loadTasks();
    }

    function renderNav() {
      const navLinks = document.getElementById("navLinks");
      if (currentUser) {
        navLinks.innerHTML = `
          <span style="font-size: 0.9rem; color: var(--text-muted);">Hi, <b>${currentUser.name}</b></span>
          <button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        `;
        if (currentUser.role === "Admin") {
          document.getElementById("adminTabBtn").classList.remove("hidden");
        } else {
          document.getElementById("adminTabBtn").classList.add("hidden");
        }
      } else {
        navLinks.innerHTML = `
          <button class="btn-primary" onclick="showAuthView()">Login / Register</button>
        `;
      }
    }

    function switchAuthMode(mode) {
      currentAuthMode = mode;
      const lTab = document.getElementById("loginTab");
      const rTab = document.getElementById("registerTab");
      const lForm = document.getElementById("loginForm");
      const rForm = document.getElementById("registerForm");
      const lGbtn = document.getElementById("googleLoginButton");
      const rGbtn = document.getElementById("googleRegisterButton");

      if (mode === 'login') {
        lTab.classList.add("active"); rTab.classList.remove("active");
        lForm.classList.remove("hidden"); rForm.classList.add("hidden");
        lGbtn.classList.remove("hidden"); rGbtn.classList.add("hidden");
      } else {
        rTab.classList.add("active"); lTab.classList.remove("active");
        rForm.classList.remove("hidden"); lForm.classList.add("hidden");
        rGbtn.classList.remove("hidden"); lGbtn.classList.add("hidden");
      }
      renderGoogleButtons();
    }

    function showAuthAlert(msg, type = "danger") {
      const el = document.getElementById("authAlert");
      el.className = `alert alert-${type}`;
      el.innerText = msg;
      el.classList.remove("hidden");
    }

    async function handleLogin(e) {
      e.preventDefault();
      try {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });
        currentUser = data.user;
        initApp();
      } catch (err) {
        showAuthAlert(err.message, "danger");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      try {
        const name = document.getElementById("regName").value;
        const email = document.getElementById("regEmail").value;
        const mobile = document.getElementById("regMobile").value;
        const city = document.getElementById("regCity").value;
        const password = document.getElementById("regPassword").value;

        const data = await api("/api/register", {
          method: "POST",
          body: JSON.stringify({ name, email, mobile, city, password })
        });
        currentUser = data.user;
        initApp();
      } catch (err) {
        showAuthAlert(err.message, "danger");
      }
    }

    async function logout() {
      await api("/api/logout", { method: "POST" });
      currentUser = null;
      showAuthView();
    }

    function switchView(view) {
      ['tasks', 'history', 'wallet', 'admin'].forEach(v => {
        const el = document.getElementById(`view${v.charAt(0).toUpperCase() + v.slice(1)}`);
        const btn = document.getElementById(`viewBtn${v.charAt(0).toUpperCase() + v.slice(1)}`);
        if (el) el.classList.add("hidden");
        if (btn) btn.classList.remove("active");
      });

      const targetEl = document.getElementById(`view${view.charAt(0).toUpperCase() + view.slice(1)}`);
      const targetBtn = document.getElementById(`viewBtn${view.charAt(0).toUpperCase() + view.slice(1)}`);
      if (targetEl) targetEl.classList.remove("hidden");
      if (targetBtn) targetBtn.classList.add("active");

      if (view === 'history') loadSubmissions();
      if (view === 'wallet') loadWithdrawals();
      if (view === 'admin') loadAdminData();
    }

    async function loadUserData() {
      if (!currentUser) return;
      document.getElementById("userBalance").innerText = `₹${currentUser.balance || 0}`;
    }

    async function loadTasks() {
      try {
        const tasks = await api("/api/tasks");
        const container = document.getElementById("tasksList");
        container.innerHTML = tasks.map(t => `
          <div class="task-card">
            <div>
              <span class="badge">${t.type || 'General'}</span>
              <h3 style="margin-bottom: 0.5rem;">${t.title}</h3>
              <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">${t.description}</p>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
              <span style="font-size: 1.2rem; font-weight: 700; color: var(--success);">₹${t.reward}</span>
              <button class="btn-primary" onclick="openTaskModal(${t.id}, '${t.title}', '${t.description}')">Earn Reward</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function openTaskModal(id, title, desc) {
      currentTaskId = id;
      document.getElementById("modalTaskId").value = id;
      document.getElementById("modalTaskTitle").innerText = title;
      document.getElementById("modalTaskDesc").innerText = desc;
      document.getElementById("taskModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("taskModal").classList.add("hidden");
    }

    async function submitTaskProof(e) {
      e.preventDefault();
      const taskId = document.getElementById("modalTaskId").value;
      const proofText = document.getElementById("proofText").value;
      const fileInput = document.getElementById("proofImage");

      let proofImage = "";
      if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = async function(evt) {
          proofImage = evt.target.result;
          await sendSubmission(taskId, proofText, proofImage);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        await sendSubmission(taskId, proofText, "");
      }
    }

    async function sendSubmission(taskId, text, img) {
      try {
        await api("/api/submissions", {
          method: "POST",
          body: JSON.stringify({ taskId, proofText: text, proofImage: img })
        });
        closeModal();
        alert("Task Proof Submitted Successfully! Pending Approval.");
        switchView('history');
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadSubmissions() {
      try {
        const subs = await api("/api/submissions/me");
        const el = document.getElementById("submissionsList");
        if (subs.length === 0) {
          el.innerHTML = "<p style='color: var(--text-muted);'>No submissions found.</p>";
          return;
        }
        el.innerHTML = subs.map(s => `
          <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h4>Task ID: ${s.taskId}</h4>
              <small style="color: var(--text-muted);">${new Date(s.createdAt).toLocaleString()}</small>
            </div>
            <div>
              <span class="badge" style="background: ${s.status === 'Approved' ? 'rgba(16,185,129,0.2)' : s.status === 'Rejected' ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)'}; color: ${s.status === 'Approved' ? '#6ee7b7' : s.status === 'Rejected' ? '#fca5a5' : '#fcd34d'};">${s.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function handleWithdraw(e) {
      e.preventDefault();
      try {
        const amount = document.getElementById("withdrawAmount").value;
        const paymentMethod = document.getElementById("withdrawMethod").value;
        const details = document.getElementById("withdrawDetails").value;

        await api("/api/withdrawals", {
          method: "POST",
          body: JSON.stringify({ amount, paymentMethod, details })
        });
        alert("Withdrawal Requested Successfully!");
        loadUserData();
        loadWithdrawals();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadWithdrawals() {
      try {
        const list = await api("/api/withdrawals/me");
        const el = document.getElementById("withdrawalsList");
        if (list.length === 0) {
          el.innerHTML = "<p style='color: var(--text-muted);'>No withdrawal requests yet.</p>";
          return;
        }
        el.innerHTML = list.map(w => `
          <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h4>₹${w.amount} via ${w.paymentMethod}</h4>
              <small style="color: var(--text-muted);">${w.details}</small>
            </div>
            <div>
              <span class="badge">${w.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function loadAdminData() {
      // Pending Submissions & Withdrawals for Admin
    }

    document.addEventListener("DOMContentLoaded", checkSession);
  </script>
</body>
</html>

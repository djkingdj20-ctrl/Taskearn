<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskEarn</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}.taskearn-boot body>*{visibility:hidden!important}.taskearn-boot body:before{content:'Loading...';visibility:visible;position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#ff6b35;font:800 24px Arial;z-index:2147483647}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:16px}.logo{font-size:28px;font-weight:900}.logo span{color:#ff6b35}.primary{background:#ff6b35;color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}.secondary{background:#eef2f7;color:#172033;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}.danger{background:#dc3545;color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}header{background:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.05)}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer}nav button.active{background:#fff0ea;color:#ff6b35}.hero{padding:25px 0}.tabs{display:flex;gap:8px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center}.muted{color:#687386}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}@media(max-width:600px){header{display:block}nav{margin-top:12px}.stats{grid-template-columns:1fr}}body{min-height:100vh}</style><script>(function(){document.documentElement.classList.add("taskearn-boot");var st=document.createElement("style");st.textContent="html.taskearn-boot body>*{visibility:hidden!important}html.taskearn-boot body:before{content:'Loading...';visibility:visible;position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#ff6b35;font:800 24px Arial;z-index:2147483647}";document.head.appendChild(st)})();</script></head><body><div id="app"></div><script>let db=JSON.parse(localStorage.getItem("taskearn_db")||'{"users":[],"tasks":[],"transactions":[],"withdrawals":[]}'),current=null;function save(){localStorage.setItem("taskearn_db",JSON.stringify(db))}function setUser(u){current=u;sessionStorage.setItem("taskearn_user",JSON.stringify(u))}function refreshUser(){if(!current)return;let u=db.users.find(x=>x.id===current.id);if(u)current=u}function app(){let saved=sessionStorage.getItem("taskearn_user");if(saved){try{current=JSON.parse(saved)}catch(e){current=null}}if(current){dashboard()}else{authPage()}}function authPage(){document.getElementById("app").innerHTML='<div class="wrap"><div class="card"><div class="logo">Task<span>Earn</span></div><h2>Welcome</h2><p class="muted">Login or create your TaskEarn account.</p><div class="tabs"><button class="primary" onclick="auth(\\'login\\')">Login</button><button class="secondary" onclick="auth(\\'register\\')">Register</button></div><div id="auth"></div></div></div>';auth("login")}function auth(type){document.getElementById("auth").innerHTML=type==="login"?'<label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="doLogin()">Login</button><p id="err"></p>':'<label>Name</label><input id="name"><label>Email</label><input id="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="doRegister()">Create account</button><p id="err"></p>'}function doLogin(){let e=email.value.toLowerCase(),u=db.users.find(x=>x.email===e);if(!u||u.password!==password.value)return err.textContent="Invalid email or password";setUser(u);app()}function doRegister(){let e=email.value.toLowerCase();if(!name.value||!e||password.value.length<6)return err.textContent="Enter name, email and a 6+ character password";if(db.users.some(x=>x.email===e))return err.textContent="Email already registered";let u={id:"u"+Date.now(),name:name.value,email:e,password:password.value,role:"user",balance:0,refCode:Math.random().toString(36).slice(2,8).toUpperCase()};db.users.push(u);save();setUser(u);app()}function dashboard(){document.getElementById("app").innerHTML='<header><div class="logo">Task<span>Earn</span></div><nav><button onclick="page(\\'home\\')" id="n-home">Home</button><button onclick="page(\\'tasks\\')" id="n-tasks">Tasks</button><button onclick="page(\\'earn\\')" id="n-earn">Earnings</button><button onclick="page(\\'ref\\')" id="n-ref">Referral</button><button onclick="page(\\'withdraw\\')" id="n-withdraw">Withdraw</button>'+(current.role==="admin"?"<button onclick=\"page('admin')\" id=\"n-admin\">Admin</button>":"")+'<button onclick="logout()">Logout</button></nav></header><main class="wrap" id="content"></main>';let lp=localStorage.getItem("taskearn_last_page")||"home";page(lp)}function page(p){try{localStorage.setItem("taskearn_last_page",p)}catch(e){}document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));let n=document.getElementById("n-"+p);if(n)n.classList.add("active");let c=document.getElementById("content");if(!c)return;if(p==="home")home(c);if(p==="tasks")tasks(c);if(p==="earn")earn(c);if(p==="ref")ref(c);if(p==="withdraw")withdrawPage(c);if(p==="admin")admin(c)}function home(c){refreshUser();c.innerHTML='<div class="hero"><h1>Welcome, '+current.name+'</h1><p>Complete tasks and earn TaskEarn Points.</p></div><div class="card"><h3>Balance</h3><h2>₹'+Number(current.balance||0).toFixed(2)+'</h2></div>'}function tasks(c){refreshUser();let ts=db.tasks.filter(t=>t.active);c.innerHTML="<h2>Tasks</h2>"+(ts.map(t=>'<div class="card"><h3>'+t.title+'</h3><p>'+t.description+'</p><b>Reward: ₹'+t.reward+'</b><br><br><button class="primary" onclick="completeTask(\\''+t.id+'\\')">Complete Task</button></div>').join("")||'<div class="card">No tasks available.</div>')}function completeTask(id){refreshUser();let t=db.tasks.find(x=>String(x.id)===String(id));if(!t)return;current.balance+=t.reward;db.transactions.push({id:"tr"+Date.now(),userId:current.id,taskId:id,type:"task",amount:t.reward,note:t.title,date:new Date().toISOString()});let u=db.users.find(x=>x.id===current.id);if(u)u.balance=current.balance;save();setUser(current);alert("Task completed. ₹"+t.reward+" added.");page("tasks")}function earn(c){let tx=db.transactions.filter(x=>x.userId===current.id).reverse();c.innerHTML='<h2>Earnings & Transactions</h2><div class="card"><table><tr><th>Activity</th><th>Amount</th><th>Date</th></tr>'+(tx.map(x=>'<tr><td>'+x.note+'</td><td>'+(x.amount>=0?"+":"")+"₹"+Number(x.amount).toFixed(2)+'</td><td>'+new Date(x.date).toLocaleString()+'</td></tr>').join("")||'<tr><td colspan="3">No transactions yet.</td></tr>')+"</table></div>"}function ref(c){c.innerHTML='<h2>Referral Program</h2><div class="card"><p>Share your referral code with friends.</p><label>Your referral code</label><input value="'+(current.refCode||"")+'" readonly><button class="primary" onclick="navigator.clipboard.writeText(\\''+(current.refCode||"")+'\\');alert(\\'Copied\\')">Copy code</button></div>'}function withdrawPage(c){c.innerHTML='<h2>Withdraw</h2><div class="card"><p>Available: <b>₹'+Number(current.balance||0).toFixed(2)+'</b></p><label>Method</label><select id="method"><option>UPI</option><option>Bank transfer</option></select><label>Amount (minimum ₹50)</label><input id="amount" type="number" min="50"><button class="primary" onclick="requestWithdrawal()">Request withdrawal</button><p id="wmsg"></p></div>'}function requestWithdrawal(){let a=Number(amount.value);if(a<50)return wmsg.textContent="Minimum withdrawal is ₹50.";if(a>current.balance)return wmsg.textContent="Insufficient balance.";current.balance-=a;db.users.find(x=>x.id===current.id).balance=current.balance;db.withdrawals.push({id:"w"+Date.now(),userId:current.id,amount:a,method:method.value,status:"pending",date:new Date().toISOString()});db.transactions.push({id:"tr"+Date.now(),userId:current.id,type:"withdrawal",amount:-a,note:"Withdrawal requested",date:new Date().toISOString()});save();setUser(current);wmsg.className="msg ok";wmsg.textContent="Withdrawal request submitted for admin review.";setTimeout(()=>page("home"),900)}function admin(c){if(current.role!=="admin")return;let pending=db.withdrawals.filter(w=>w.status==="pending");c.innerHTML='<h2>Admin Dashboard</h2><div class="stats"><div class="card stat"><span class="muted">Users</span><b>'+db.users.length+'</b></div><div class="card stat"><span class="muted">Tasks</span><b>'+db.tasks.length+'</b></div><div class="card stat"><span class="muted">Pending withdrawals</span><b>'+pending.length+'</b></div></div><br><div class="card"><h3>Add task</h3><label>Title</label><input id="tt"><label>Description</label><input id="td"><label>Reward ₹</label><input id="tr" type="number"><button class="primary" onclick="addTask()">Add task</button></div><br><div class="card"><h3>Withdrawal requests</h3><table><tr><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Action</th></tr>'+db.withdrawals.map(w=>{let u=db.users.find(x=>x.id===w.userId);return '<tr><td>'+(u?u.email:"Unknown")+'</td><td>₹'+w.amount+'</td><td>'+w.method+'</td><td><span>'+w.status+'</span></td><td>'+(w.status==="pending"?'<button class="primary" onclick="review(\\''+w.id+'\\',\\'approved\\')">Approve</button> <button class="danger" onclick="review(\\''+w.id+'\\',\\'rejected\\')">Reject</button>':"—")+"</td></tr>"}).join("")||'<tr><td colspan="5">No requests.</td></tr>'+"</table></div>"}function addTask(){if(!tt.value||!td.value||Number(tr.value)<=0)return alert("Fill all task fields.");db.tasks.push({id:"t"+Date.now(),title:tt.value,description:td.value,reward:Number(tr.value),active:true});save();page("admin")}function review(id,status){let w=db.withdrawals.find(x=>x.id===id);if(!w)return;if(status==="rejected"){let u=db.users.find(x=>x.id===w.userId);u.balance+=w.amount;db.transactions.push({id:"tr"+Date.now(),userId:u.id,type:"refund",amount:w.amount,note:"Rejected withdrawal refund",date:new Date().toISOString()})}w.status=status;save();page("admin")}function logout(){sessionStorage.removeItem("taskearn_user");localStorage.removeItem("taskearn_last_page");current=null;app()}async function taskEarnBoot(){try{const r=await fetch("/api/me",{credentials:"include",cache:"no-store"});let d=null;try{d=await r.json()}catch(e){}if(r.ok&&d){if(typeof setUser==="function")setUser(d);localStorage.setItem("taskearn_last_page",localStorage.getItem("taskearn_last_page")||"home");app();let lp=localStorage.getItem("taskearn_last_page")||"home";if(typeof page==="function"&&document.getElementById("content"))page(lp)}else{sessionStorage.removeItem("taskearn_user");if(typeof app==="function")app()}}catch(e){if(typeof app==="function")app()}finally{document.documentElement.classList.remove("taskearn-boot")}}taskEarnBoot();</script></body></html>

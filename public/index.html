<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskEarn - Register & Verification</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #aaa; }
    .error-msg { color: #dc3545; font-size: 14px; margin-top: 10px; text-align: center; }
    .success-msg { color: #28a745; font-size: 14px; margin-top: 10px; text-align: center; }
    .otp-screen { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- 1. REGISTRATION FORM -->
  <div id="registerSection">
    <h2>క్రియేట్ అకౌంట్</h2>
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>పేరు (Name)</label>
        <input type="text" id="regName" required placeholder="మీ పేరు">
      </div>
      <div class="form-group">
        <label>Gmail ఐడీ</label>
        <input type="email" id="regEmail" required placeholder="example@gmail.com">
      </div>
      <div class="form-group">
        <label>మొబైల్ నంబర్</label>
        <input type="tel" id="regMobile" required placeholder="9876543210">
      </div>
      <div class="form-group">
        <label>పాస్‌వర్డ్</label>
        <input type="password" id="regPassword" required placeholder="పాస్‌వర్డ్">
      </div>
      <button type="submit" id="regBtn">సబ్‌మిట్ చేయండి</button>
    </form>
  </div>

  <!-- 2. OTP VERIFICATION SCREEN -->
  <div id="otpSection" class="otp-screen">
    <h2>OTP వెరిఫికేషన్</h2>
    <p id="otpNotice" style="color: #555; font-size: 14px;"></p>
    
    <div class="form-group">
      <input type="text" id="otpInput" maxlength="6" placeholder="6 అంకెల OTP ఎంటర్ చేయండి" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
    </div>
    
    <button onclick="handleVerifyOtp()" id="verifyBtn">Verify OTP</button>
    <button onclick="handleResendOtp()" style="background: transparent; color: #007bff; margin-top: 8px;">కొత్త OTP పంపు</button>
  </div>

  <!-- MSG DISPLAY -->
  <div id="msgDisplay" class="error-msg"></div>
</div>

<script>
  function showMsg(msg, isError = true) {
    const el = document.getElementById("msgDisplay");
    el.className = isError ? "error-msg" : "success-msg";
    el.innerText = msg;
  }

  // REGISTER SUBMIT
  async function handleRegister(e) {
    e.preventDefault();
    showMsg("");
    const btn = document.getElementById("regBtn");
    btn.disabled = true;
    btn.innerText = "పంపబడుతోంది...";

    const payload = {
      name: document.getElementById("regName").value,
      email: document.getElementById("regEmail").value,
      mobile: document.getElementById("regMobile").value,
      password: document.getElementById("regPassword").value
    };

    try {
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      btn.disabled = false;
      btn.innerText = "సబ్‌మిట్ చేయండి";

      if (data.error) {
        showMsg(data.error, true);
        return;
      }

      if (data.verificationRequired) {
        // ఫారమ్ దాచి, OTP స్క్రీన్ చూపించడం
        document.getElementById("registerSection").style.display = "none";
        document.getElementById("otpSection").style.display = "block";
        document.getElementById("otpNotice").innerText = `${data.email} కి పంపిన OTP నమోదు చేయండి:`;
        showMsg(data.message || "OTP పంపబడింది", false);
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "సబ్‌మిట్ చేయండి";
      showMsg("సర్వర్ తో కనెక్షన్ టైమ్‌అవుట్ అయింది. మళ్ళీ ట్రై చేయండి.");
    }
  }

  // VERIFY OTP SUBMIT
  async function handleVerifyOtp() {
    showMsg("");
    const otp = document.getElementById("otpInput").value.trim();
    if (otp.length !== 6) {
      showMsg("6 అంకెల OTP నమోదు చేయండి.");
      return;
    }

    const btn = document.getElementById("verifyBtn");
    btn.disabled = true;

    try {
      const res = await fetch("/api/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ otp })
      });

      const data = await res.json();
      btn.disabled = false;

      if (data.error) {
        showMsg(data.error, true);
        return;
      }

      if (data.step === "mobile") {
        document.getElementById("otpInput").value = "";
        document.getElementById("otpNotice").innerText = `Gmail వెరిఫై అయింది! ఇప్పుడు ${data.mobile} నంబర్‌కు వచ్చిన SMS OTP ఎంటర్ చేయండి:`;
        showMsg("మొబైల్ OTP పంపబడింది.", false);
      } else if (data.step === "complete") {
        showMsg("అకౌంట్ విజయవంతంగా వెరిఫై చేయబడింది!", false);
        setTimeout(() => window.location.reload(), 2000);
      }
    } catch (err) {
      btn.disabled = false;
      showMsg("వెరిఫికేషన్ ఫెయిల్ అయింది. మళ్ళీ ప్రయత్నించండి.");
    }
  }

  // RESEND OTP
  async function handleResendOtp() {
    showMsg("");
    try {
      const res = await fetch("/api/resend-otp", { method: "POST" });
      const data = await res.json();
      if (data.error) showMsg(data.error, true);
      else showMsg(data.message || "కొత్త OTP పంపబడింది.", false);
    } catch (err) {
      showMsg("OTP పంపడంలో విఫలమైంది.");
    }
  }
</script>

</body>
</html>
